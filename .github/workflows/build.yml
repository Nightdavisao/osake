name: Build for Linux targets

on:
  push:
    branches: ["*"]

jobs:
  build-linux:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run app:dist -- --linux
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*
      - name: Create pre-release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: linux-${GITHUB_SHA::7}
          name: Nightly release for Linux ${GITHUB_SHA::7}
          prerelease: true
          files: dist/*
